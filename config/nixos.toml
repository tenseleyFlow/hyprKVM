# HyprKVM Configuration - NixOS box (right side)

[machines]
self_name = "nixos"

[[machines.neighbors]]
name = "cachyos"
direction = "left"
address = "192.168.0.84:24850"

[network]
listen_port = 24850
bind_address = "0.0.0.0"

[input.escape_hotkey]
key = "scroll_lock"
modifiers = []
triple_tap_enabled = true
triple_tap_key = "shift"
triple_tap_window_ms = 500

[clipboard]
enabled = true

[logging]
level = "debug"
