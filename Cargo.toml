[workspace]
resolver = "2"
members = [
    "hyprkvm-daemon",
    "hyprkvm-cli",
    "hyprkvm-common",
]

[workspace.package]
version = "0.5.1"
edition = "2021"
authors = ["tenseleyFlow"]
license = "MIT"
repository = "https://github.com/tenseleyFlow/hyprKVM"
description = "Hyprland-native software KVM switch"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# CLI
clap = { version = "4", features = ["derive"] }

# Wayland
wayland-client = "0.31"
wayland-protocols = { version = "0.31", features = ["client", "unstable"] }
wayland-protocols-wlr = "0.3"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
smithay-client-toolkit = "0.19"

# TLS
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["aws_lc_rs"] }
rustls-pemfile = "2"
rcgen = "0.13"
sha2 = "0.10"
time = "0.3"

# Utilities
dirs = "5"
bytes = "1"
hostname = "0.4"
rustix = { version = "0.38", features = ["fs"] }

# Clipboard
wl-clipboard-rs = "0.9"
hex = "0.4"
base64 = "0.22"

# GUI (optional)
iced = { version = "0.13", features = ["canvas", "tokio", "tiny-skia"] }

# Internal crates
hyprkvm-common = { path = "hyprkvm-common" }
